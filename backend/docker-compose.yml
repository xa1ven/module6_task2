services:
  postgres:
    image: postgres:16
    container_name: nobel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nobel_db
      POSTGRES_USER: nobel_user
      POSTGRES_PASSWORD: nobel_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: nobel-backend
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8081:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/nobel_db
      DB_USER: nobel_user
      DB_PASSWORD: nobel_pass

volumes:
  postgres_data:
